meta:
  name: Autodocs
  description: >
    Self-hosted сервис автогенерации документации по легаси-коду (PL/SQL Oracle 11,
    Delphi 7) локальной LLM на Ollama: по событию или расписанию обходит источники,
    документирует изменённые объекты и публикует markdown со схемами в вики.
    Код не покидает контур.
  runtime: Docker на Linux (docker compose, без Kubernetes и очередей)
  trigger: cron-расписание; commit / merge / релиз (webhook или поллинг git)
  distribution:
    - channel: docker compose up
      audience: Администратор
      purpose: развёртывание из коробки на своём железе (US-001)

# ─── Глоссарий ────────────────────────────────────────────────────────────────

glossary:
  source: Источник кода — примонтированный волюм с исходниками или Oracle 11 (ALL_SOURCE)
  object: Единица документирования — пакет, процедура, функция, триггер, вьюха, модуль Delphi
  chunk: Фрагмент большого объекта, влезающий в контекст модели; режется по границам процедур
  checksum: Хэш исходника объекта для детектирования изменений (SKIP при совпадении)
  run: Один проход генерации — скан источников, обработка изменённых объектов, публикация
  page: Markdown-страница документации одного объекта в вики
  diagram: Mermaid-схема связей, построенная статическим анализом (не выводом LLM)
  backend: LLM-endpoint — Ollama (OpenAI-совместимый API), локальный или распределённый

# ─── Архитектура ─────────────────────────────────────────────────────────────

deployment:
  services_logical: 1  # весь пайплайн — модули одного процесса; очередей нет, состояние в SQLite
  containers:
    - name: autodocs
      required: true
      description: Сам сервис — scanner/parser/generator/publisher + cron и webhook в одном процессе
    - name: ollama
      required: false
      description: >
        Инференс. Не нужен, если Ollama уже захощена — autodocs ходит по OLLAMA_URL.
        Отдельный контейнер из-за другого жизненного цикла (волюмы моделей, GPU/RAM-хост).
    - name: viewer
      required: false
      description: >
        Просмотр вики — mkdocs serve или nginx со статикой. Альтернатива:
        autodocs сам делает mkdocs build в волюм, статику отдаёт любой существующий веб-сервер.
  modes:
    - name: docker compose (рекомендуемый)
      description: Референсный стек из коробки — одна команда, волюмы и сеть декларативно
    - name: одиночный docker run
      description: Минимум — только контейнер autodocs, при уже захощенной Ollama
    - name: без Docker
      description: >
        python-процесс + systemd. Возможно, но не рекомендуется — Docker решает
        боль со старым Oracle instant client (запекается в образ).

components:
  scanner:
    description: Обходит источники, строит реестр объектов с чексуммами
    inputs: [волюм с кодом (read-only), Oracle ALL_SOURCE (read-only SELECT)]
  parser:
    description: >
      Статический анализ — сигнатуры, публичный API, зависимости (пакет → пакет,
      пакет → таблица, Delphi → пакет). Источник фактов для диаграмм.
  generator:
    description: >
      Вызывает LLM для описаний. Большие объекты — map-reduce по чанкам:
      описание каждого чанка, затем сводка объекта из описаний чанков.
  publisher:
    description: >
      Рендерит страницы (описание + факты парсера + mermaid) и кладёт в вики.
      Идемпотентен — обновляет существующие страницы, дубли не плодит.
  state_store:
    description: >
      Локальное состояние — чексуммы, статусы объектов, история проходов.
      SQLite в volume сервиса; внешних БД и очередей нет.
  trigger_engine:
    description: cron-планировщик + приёмник webhook + поллинг git; глобальный lock на run

# ─── Машина состояний объекта ────────────────────────────────────────────────

state_machine:
  states:
    PENDING:   {description: Объект в очереди текущего прохода}
    RUNNING:   {description: Генерация описания объекта идёт прямо сейчас}
    SUCCESS:   {description: Страница сгенерирована и опубликована}
    SKIPPED:   {description: Чексумма не изменилась — LLM не вызывалась}
    RETRYING:  {description: Retryable-ошибка (таймаут/обрыв Ollama), попытка будет повторена}
    ERROR:     {description: Ошибка после MAX_RETRIES или non-retryable (битый файл)}
  transitions:
    - {from: PENDING,  to: RUNNING,  trigger: воркер взял объект}
    - {from: RUNNING,  to: SKIPPED,  trigger: checksum == last_applied_checksum}
    - {from: RUNNING,  to: SUCCESS,  trigger: страница опубликована}
    - {from: RUNNING,  to: RETRYING, trigger: таймаут / 5xx / обрыв ответа backend}
    - {from: RETRYING, to: RUNNING,  trigger: retry_count < MAX_RETRIES}
    - {from: RETRYING, to: ERROR,    trigger: retry_count >= MAX_RETRIES}
    - {from: RUNNING,  to: ERROR,    trigger: non-retryable — нечитаемый исходник, ошибка парсинга}
  notes: Ошибка одного объекта не прерывает проход (US-011) — изоляция per-object.

# ─── Конфигурация ────────────────────────────────────────────────────────────

config:  # env-переменные / config.yml
  llm:
    - {key: OLLAMA_URL,        required: true,  example: "http://ollama:11434"}
    - {key: OLLAMA_MODEL,      required: true,  example: "qwen2.5-coder:14b"}
    - {key: LLM_CONTEXT_TOKENS, required: false, default: 8192,
       description: Бюджет контекста — определяет размер чанка}
    - {key: LLM_TIMEOUT_SEC,   required: false, default: 600}
  sources:
    - {key: CODE_PATH,         required: false, default: /code,
       description: Точка монтирования волюма с исходниками (read-only)}
    - {key: ORACLE_DSN,        required: false, description: host:port/service; пусто — источник отключён}
    - {key: ORACLE_USER,       required: false}
    - {key: ORACLE_PASSWORD,   required: false, secret: true}
    - {key: ORACLE_SCHEMAS,    required: false, description: список схем через запятую}
  triggers:
    - {key: SCHEDULE_CRON,     required: false, example: "0 3 * * *"}
    - {key: GIT_POLL_SEC,      required: false, default: 0, description: 0 — поллинг отключён}
    - {key: WEBHOOK_SECRET,    required: false, secret: true}
  publish:
    - {key: WIKI_TYPE,         required: false, default: mkdocs,
       description: >
         Целевая вики. MVP — только mkdocs (markdown в git + MkDocs Material).
         Publisher — адаптер за интерфейсом; wikijs/confluence — будущие адаптеры (US-018).}
    - {key: WIKI_PATH,         required: false, default: /wiki,
       description: Волюм с git-репозиторием документации (docs/ + mkdocs.yml)}
  prompts:
    - {key: PROMPTS_PATH,      required: false, default: /prompts,
       description: >
         Волюм с редактируемыми промптами и шаблонами страниц. При первом старте
         туда копируются дефолты из образа; пользователь правит файлы напрямую (US-017).}
  system:
    - {key: MAX_RETRIES,       required: false, default: 3}
    - {key: LOG_LEVEL,         required: false, default: INFO}

# ─── Ограничения платформы ───────────────────────────────────────────────────

platform_constraints:
  no_external_llm: Запрещены любые внешние LLM API — только локальный backend (EXCL-001)
  read_only_sources: Волюм кода read-only, Oracle — только SELECT (EXCL-002)
  oracle_version: 11g — драйвер должен поддерживать старый протокол (thick mode / старый клиент)
  no_queues: Очередей в инфраструктуре нет — конкурентность через глобальный lock и SQLite
  ram_limited: >
    RAM под модель ограничена — размер модели выбирается под железо;
    распределённый инференс (суммирование RAM нескольких хостов) — post-MVP (US-013)
  package_size: PL/SQL-пакеты до 15–20 тыс. строк — чанкование обязательно (US-005)
  throughput_estimate: >
    Полный первичный проход по 20-летней базе может занимать часы/сутки —
    инкрементальность по чексуммам (US-007) обязательна со второго прохода.

# ─── Соглашения ──────────────────────────────────────────────────────────────

conventions:
  wiki_structure:
    principle: >
      Иерархия и навигация вики — детерминированные, выводятся из структуры кода
      (схема БД → пакет → объект; Delphi: проект → модуль). LLM на структуру
      не влияет — страницы не «переезжают» между прогонами, ссылки стабильны.
    mkdocs: publisher генерирует дерево docs/*.md и секцию nav в mkdocs.yml

  prompts:
    layout:
      - "prompts/templates/*.md.j2 — jinja2-скелеты страниц: секции, места фактов парсера, LLM-текста, диаграмм"
      - "prompts/package.md, chunk.md, summary.md — семейство PL/SQL"
      - "prompts/delphi_unit.md, delphi_chunk.md, delphi_summary.md — семейство Delphi (с секцией «Работа с БД» — связь с PL/SQL)"
      - "prompts/python_module.md, python_chunk.md, python_summary.md — семейство Python (US-019)"
    defaults: лежат в образе; при первом старте копируются в PROMPTS_PATH, если там пусто
    editing: потребитель правит файлы в волюме напрямую — без пересборки образа
    invalidation: >
      Чексумма промпта/шаблона входит в ключ кэша страницы — правка промпта
      регенерирует затронутые страницы на следующем прогоне.

  llm_usage:
    mode: deterministic_pipeline
    description: >
      Генерация — детерминированный пайплайн без tool calling и агентности:
      parser заранее собирает контекст (исходник чанка + факты о зависимостях),
      модель только пишет текст по готовому контексту. Лёгкие локальные модели
      (7–14B) ненадёжны в tool calling — агентный цикл на них хрупок и дорог
      в отладке внутри закрытого контура.
    future: >
      Agentic-режим («прочитай тело процедуры», «покажи вызовы») — только если
      map-reduce упрётся в потолок качества на больших пакетах, и на модели
      покрупнее. MCP-интерфейс к готовой документации — extension (US-016).
  pages:
    hierarchy: "схема БД → пакет → объект; Delphi: проект → модуль"
    frontmatter: [generated_at, model, source_checksum, source_ref]
    trust_marks: >
      Факты парсера (сигнатуры, зависимости) и текст LLM (назначение, логика)
      визуально разделены (US-014). Диаграммы — только из парсера, не из LLM.
  regeneration:
    scope: только объекты с изменившейся чексуммой + затронутые обзорные схемы
    manual_edits: генерируемая секция отделена маркерами; вне маркеров правки сохраняются
  locking:
    strategy: один run одновременно; новый триггер при активном run — SKIP с записью в лог
  logging:
    per_run_report: счётчики processed / skipped / error + список ошибочных объектов
    secrets: пароли и DSN никогда не пишутся в логи и страницы

# ─── Открытые вопросы (из TZ.md) ─────────────────────────────────────────────

open_questions:
  - Целевая вики (Confluence / MediaWiki / Wiki.js / git-based / *MkDocs Material) — MVP исходит из git-markdown
  - Git-хостинг и доступность webhooks — иначе поллинг или только расписание
  - Формат доступа к Oracle — прямой read-only или выгрузка DDL в репозиторий
  - Доступное железо → выбор модели и LLM_CONTEXT_TOKENS
  - Приоритет Delphi-части (US-012) относительно PL/SQL
