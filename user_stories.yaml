  how_to_test:
    situation:
    - Чистый Linux-хост с Docker и docker compose.
    - Ollama доступна (локально или по сети) с выбранной моделью.
    start: docker compose up -d
    success:
    - Сервис поднимается одной командой без ручной донастройки.
    - Конфигурация задаётся через env / config-файл — путь к коду (волюм), адрес Ollama, имя модели.
