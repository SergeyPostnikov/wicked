feature: Autodocs — self-hosted сервис автогенерации документации по коду через локальную LLM
goal: Автоматически документировать легаси-кодовую базу (PL/SQL Oracle 11, Delphi 7)
  локальной моделью на Ollama и публиковать результат в вики — без отправки кода во
  внешние сервисы.
motto:
  - Код не покидает контур — только локальная модель на Ollama, никаких внешних API.
  - Из коробки — захостил в Docker, примонтировал код волюмом (или дал доступ к Oracle), получил доку.
  - Инкрементальность — по событию (commit, merge, релиз, расписание) обновляется только то, что изменилось.
  - Большие пакеты не проблема — чанкование PL/SQL-пакетов по 15–20 тыс. строк под контекст модели.
  - Документация = текст + схемы — описания объектов и диаграммы связей (mermaid/plantuml).

