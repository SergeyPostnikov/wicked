    situation:
    - В источнике есть PL/SQL-пакет среднего размера (до контекста модели).
    start: запуск генерации (по событию или вручную)
    success:
    - Для пакета создана markdown-страница — назначение пакета, список публичных
      процедур/функций с параметрами, используемые таблицы и вызываемые пакеты.
    - Описание сгенерировано локальной моделью — исходящего трафика к внешним LLM нет.
    - Страница содержит метаданные — дата генерации, модель, версия/чексумма исходника.
  notes: null
  successful_test_date: null
  verified_by: null

- id: US-005
  checked: null
  type: mvp
  product_subsystem: Генерация / Большие пакеты
  role: Система
  key_function: Чанкование пакетов 15–20 тыс. строк под контекст модели
  how_to_test:
    situation:
    - В источнике пакет на 15–20 тыс. строк, не влезающий в контекст модели целиком.
    start: запуск генерации
    success:
    - Пакет разбивается на чанки по границам процедур/функций, не по произвольным строкам.
    - Каждый чанк документируется отдельно, затем модель собирает сводное описание пакета
      из описаний чанков (map-reduce).
    - Итоговая страница цельная — без обрывов и повторов.
    - Генерация не падает по OOM и по превышению контекста.
  notes: Ключевой риск проекта — проверить на реальном пакете заказчика в первую очередь.
  successful_test_date: null
  verified_by: null

